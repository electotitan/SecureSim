<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Pipeline Debug Harness (Phase 1)</title>
<style>
  body { font-family: monospace; max-width: 800px; margin: 2rem auto; }
  input { width: 60%; padding: 0.5rem; }
  button { padding: 0.5rem 1rem; }
  .stage { border: 1px solid #ccc; margin: 0.5rem 0; padding: 0.5rem; }
  .stage h3 { margin: 0 0 0.25rem 0; }
  pre { background: #f5f5f5; padding: 0.5rem; overflow-x: auto; }
</style>
</head>
<body>
  <h1>Pipeline Debug Harness</h1>
  <p>
    This is <strong>not</strong> the real visualizer (that's Phase 4).
    It just proves the API + pipeline wiring works by dumping the raw
    trace JSON for each stage.
  </p>

  <input id="msg" value="Hello, secure world!" />
  <button onclick="runPipeline()">Run pipeline</button>

  <div id="summary"></div>
  <div id="stages"></div>

<script>
async function runPipeline() {
  const message = document.getElementById('msg').value;
  const res = await fetch('/run', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ message })
  });
  const data = await res.json();

  document.getElementById('summary').innerHTML = `
    <p><strong>Original:</strong> ${data.original_message}</p>
    <p><strong>Final:</strong> ${data.final_output}</p>
    <p><strong>Recovered correctly:</strong> ${data.recovered_correctly}</p>
  `;

  const stagesDiv = document.getElementById('stages');
  stagesDiv.innerHTML = '';
  data.traces.forEach((t, i) => {
    const div = document.createElement('div');
    div.className = 'stage';
    div.innerHTML = `
      <h3>${i + 1}. ${t.stage_name}</h3>
      <pre>${JSON.stringify(t, null, 2)}</pre>
    `;
    stagesDiv.appendChild(div);
  });
}
</script>
</body>
</html>
